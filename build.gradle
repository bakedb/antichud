import java.security.MessageDigest
import java.nio.file.Files
import java.util.HexFormat

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Stonecutter runs this script once per entry in settings.gradle, so everything below is
// evaluated against that entry's versions/<minecraft version>/gradle.properties.
def mcVersion = property('minecraft_version') as String
def loaderVersion = property('loader_version') as String
def apiVersion = property('fabric_version') as String

// Minecraft 26.1 dropped obfuscation, so the jar needs no mappings and no remapping.
// The matching property lives next to the per version dependencies.
def unobfuscated = sc.current.parsed.matches('>=26.1')
// Two later releases moved things again: 26.2 moved screen handling onto Gui, and 26.3 renamed
// the render pipeline package and split Pack.ResourcesSupplier in two.
def guiScreens = sc.current.parsed.matches('>=26.2')
def splitPacks = sc.current.parsed.matches('>=26.3')
def targetJavaVersion = Integer.parseInt(property('java_version') as String)

// One jar per Minecraft version, e.g. antichud-0.2+26.3.jar
version = "${property('mod_version')}+${mcVersion}"
group = property('maven_group') as String

base {
    archivesName = property('archives_base_name') as String
}

stonecutter {
    // Minecraft 26.x renamed the GUI drawing class, the render pipeline package and a handful of
    // methods. Those are pure textual renames, so they are expressed as replacements rather than
    // as `//? if` conditions to keep the sources readable.
    replacements.string(unobfuscated) {
        // 26.1: GuiGraphics -> GuiGraphicsExtractor, and the text drawing methods were renamed.
        replace 'GuiGraphics', 'GuiGraphicsExtractor'
        replace 'graphics.drawString(', 'graphics.text('
        replace 'graphics.drawCenteredString(', 'graphics.centeredText('
        replace 'renderTransparentBackground', 'extractTransparentBackground'

        // 26.1: screens extract their render state instead of drawing straight away.
        replace '"render"', '"extractRenderState"'
        replace 'void render(', 'void extractRenderState('
        replace 'super.render(', 'super.extractRenderState('

        // Fabric API 0.155 renamed the builtin pack source and the payload registries.
        replace 'BuiltinModResourcePackSource', 'BuiltinModPackSource'
        replace 'PayloadTypeRegistry.playC2S()', 'PayloadTypeRegistry.serverboundPlay()'
        replace 'PayloadTypeRegistry.playS2C()', 'PayloadTypeRegistry.clientboundPlay()'
    }

    replacements.string(guiScreens) {
        // 26.2: the current screen moved off Minecraft onto Gui.
        replace 'minecraft.setScreen(', 'minecraft.gui.setScreen('
        replace 'Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen('
    }

    replacements.string(splitPacks) {
        // 26.3: blaze3d was renamed to renderpearl.
        replace 'com.mojang.blaze3d.pipeline.RenderPipeline', 'com.mojang.renderpearl.api.pipeline.RenderPipeline'
        replace 'Lcom/mojang/blaze3d/pipeline/RenderPipeline;', 'Lcom/mojang/renderpearl/api/pipeline/RenderPipeline;'

        // 26.3: a pack plus its overlays is now an OverlayedPackResources.
        replace 'CompositePackResources', 'OverlayedPackResources'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "antichud" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Loom adds the Minecraft and library repositories automatically; mods would go here.
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"

    if (unobfuscated) {
        // The game is already in named form, so `mappings` must stay empty and the plain
        // `implementation` configuration is used instead of `modImplementation`.
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
    } else {
        mappings loom.officialMojangMappings()

        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", mcVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": mcVersion,
                "loader_version": loaderVersion
    }
}

task computeJarChecksum {
    doLast {
        def jarFile = file("build/libs/${archives_base_name}-${version}.jar")
        if (jarFile.exists()) {
            def digest = MessageDigest.getInstance("SHA-256")
            digest.update(Files.readAllBytes(jarFile.toPath()))
            println "JAR SHA256: ${HexFormat.of().formatHex(digest.digest()).toLowerCase()}"
        } else {
            println "JAR not found at: $jarFile"
        }
    }
}

// Obfuscated builds produce the mod through remapJar, unobfuscated ones go straight through jar.
if (tasks.findByName('remapJar') != null) {
    tasks.named('remapJar') { task ->
        task.finalizedBy('computeJarChecksum')
    }
} else {
    tasks.named('jar') { task ->
        task.finalizedBy('computeJarChecksum')
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
