# Dependencies for Minecraft 26.3
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.161.0+26.3
java_version=25

# Minecraft 26.1+ ships unobfuscated: there are no mappings to remap against and the jar
# does not need remapping. Loom detects this from the property.
fabric.loom.disableObfuscation=true
