# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

# Mod Properties (shared by every Minecraft version)
mod_version=0.3.1
maven_group=lol.bkd
archives_base_name=antichud

# Fabric Properties (shared by every Minecraft version)
# check these on https://fabricmc.net/develop
loom_version=1.18-SNAPSHOT

# Minecraft version that `gradle build` builds when no version is named.
# See versions/<minecraft version>/gradle.properties for the per version dependencies.
minecraft_version=1.21.11

# This project uses the Groovy DSL on purpose, so opt out of Stonecutter's Kotlin-only nag.
dev.kikugie.stonecutter.hard_mode=true
